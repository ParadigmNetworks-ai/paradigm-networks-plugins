name: scorecard

# OpenSSF Scorecard: checks this repository against supply-chain security
# practices (branch protection, pinned actions, token permissions, signed
# releases, …) and publishes the result, so customers and auditors can see it
# at https://scorecard.dev/viewer/?uri=github.com/ParadigmNetworks-ai/paradigm-networks-plugins.
# Findings also show under Security → Code scanning. It only reads the
# repository; see release/supply-chain/README.md in the source repository.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the OpenSSF API
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif

name: verify-builds

# This repository is published by release/release.sh in Paradigm Networks'
# source repository; BUILD records which commit each release came from.
# The plugins ship no builds: each plugin's launcher downloads the build for
# its machine from the GitHub Release of its version. This checks that each
# plugin's runtime/SHA256SUMS, the list the release key signs, names the six
# builds and every other file the plugin ships, with nothing missing or extra,
# and all match; that every release key the
# launchers carry is pinned below and each list is signed with one; that the
# pinned files (LAUNCHER_CODE below: both launchers, verify.ps1, run-hook.cmd,
# both hooks.json, the login/logout/check-configured scripts, every skill's
# SKILL.md, cursor/rules/pn-login-check.mdc, the three .gitattributes, and
# both plugin.json and marketplace.json with their version normalized) are
# the code pinned
# below, apart from their keys and require-signature switch, and that nothing
# else in the plugins can load or run (no .mcp.json, .lsp.json,
# settings.json, commands, agents, new skills or rules, extra hooks or
# scripts); that the launchers require that signature; and that a promotion
# to staging or main carries exactly the files of the tagged release QA
# tested, never an older version. Once the release is published (a
# pre-release from develop, then on main before it's made the latest), the
# launchers job installs nothing but runs the launchers as users do, on Linux
# and on Windows (Windows PowerShell 5.1 and Git Bash): they download the
# build from the release, check the signature and the build, and run it.
#
# Then, on a push, it finishes the release: on develop it checks the draft
# GitHub Release stage 1 made, tags the merge commit v<version> and publishes
# the draft as a pre-release for QA (stage 2, with the pn-plugins-release App,
# the only one allowed to create v* tags); on main it checks that release
# again and makes it the latest release (stage 3, with the job's own token).
# Stage 1, which builds, signs, opens the release PR and makes the draft,
# runs in the source repository.

on:
  pull_request:
  push:
    branches: [develop, main]

permissions: {}

env:
  # The release keys, by the SHA-256 of each one's DER public key. Every key
  # the launchers carry must be one of these, and every list must be signed
  # with one (.github/scripts/check-signatures.sh), so a release can't bring in
  # a key of its own. Pinned here because the release App can't change this
  # repository's workflows. To add the next key: add its fingerprint here in a
  # reviewed PR, one release before it signs (release/signing/README.md in the
  # source repository).
  RELEASE_KEYS: >-
    1ecb9232ad0f32a2ae04d183cc4c51e5b94f8b35decc6196cbdf895393150d5a
  # The code that checks a release before it runs, pinned: the SHA-256 of
  # each file with its keys block and require-signature line replaced by
  # placeholders (.github/scripts/check-code.sh), of the hooks, login
  # scripts, skills and Cursor rule as they are (a skill can run commands as
  # it loads, outside the hooks), and of the plugin.json and marketplace.json files
  # with their version replaced by a placeholder. Everything else in these
  # files must be exactly this, so a launcher can't check differently or read
  # a key from elsewhere, a hook can't run something else, and a manifest
  # can't point at another hooks file or add MCP/LSP servers, commands or
  # agents; a version bump alone keeps the pins. A change to them needs
  # its new pin added next to the old one here, in a reviewed PR merged
  # before the release that brings it; a file passes on any of its pins.
  # Remove the old pin once that release is on main. A pin for a file the
  # base branch's check-code.sh doesn't know is only a warning there, so the
  # pins for a newly pinned file land first (or with the script that requires
  # them), never after it. To recompute, in
  # the source repository at the release commit (the same values come from a
  # released tree with .github/scripts/check-code.sh --print .):
  #   release/public/.github/scripts/check-code.sh --print .
  LAUNCHER_CODE: >-
    claude/runtime/pn-plugin=ec614440eace0ccc4a95398ce3f46cb6282b7393cc15f4e97fc9c14c00f9d17c
    cursor/runtime/pn-plugin=bd4df2aaf4c659937a28c0edd580537f1c37682a544fe9bcbdec12fe0621fddb
    cursor/runtime/verify.ps1=a6b9ffea5eed044f36e9047e139e99484df81aaf164537bac3852075326351e9
    cursor/scripts/run-hook.cmd=c4749a2e8713266602586861df0bffa8503b1ac276736168e3e02998f60d08f1
    .gitattributes=9565ac2ed6b889bb3634706874f63cdc66ac410d94f82eb6117cc73d4470a71d
    claude/.gitattributes=9708ad2302511a06e86dc4cfdfacbeaef8eaa2fb15e7dce00ea7323c8ce21703
    cursor/.gitattributes=8e450fc71f52d4f126ca47230fc8ecf199a9dcbe0fb7a1e87788153dbd0dceec
    claude/hooks/hooks.json=4faefaf0ea29a097256e92f78acd36e4af46a7da5ed7d2a3e709236b29472fce
    claude/scripts/check-configured.sh=25be0993e6e6393619cd3ea7bfb8efc2c8e02c90e79a812b1dfda2c58d9e37d1
    claude/scripts/login.sh=e62fe185ffe78dbd3fed4abbfea53adc7f31f0f4b93f3dd6e9cf0276e01f1f40
    claude/scripts/logout.sh=0227e9773a71089ee8f95dab026327ca980ff2b7780cdfbb5b5d10574294fe6f
    cursor/hooks/hooks.json=32448bcb1437895fe965dd4639a3e3f6ad637e918452c0bb9b517c06a38c018b
    cursor/scripts/check-configured.ps1=7e54e6d50b21a00e5f3f3a8ca079da42954c3c182e5ee2a7d55354a1daab86f0
    cursor/scripts/check-configured.sh=1c91315116249d0bb86c3f49ff94315edf3aaf77ab958d14450ef2737303d435
    cursor/scripts/login.ps1=01c023117fcbca2bb5ef19b1764651f242b69a2f63316d41e8f17e1726dfe5ed
    cursor/scripts/login.sh=a11233e32ce6839871e5e2d0e2b1eb5a7e7ebfe3026f9cfc6b5a63e1746ed6b3
    cursor/scripts/logout.ps1=c5abec4776b1d27f003c7064d6392c9782199fbdfcd06ef034e1e65a8de03145
    cursor/scripts/logout.sh=b2efaa7b7f917314ce396501703d14fc8bbaccdaa1b8acf1820eb56ebc39ee2e
    claude/skills/paradigmnetworks-login/SKILL.md=375061750fc1043894eb17291ec8ec120fe5c2c8a514edcd33fca2ced1290df0
    claude/skills/paradigmnetworks-logout/SKILL.md=fb9a649a11e78f6b53c0ee16bb1826fe660fb46e4dfdb9f33df129662e6674c0
    cursor/skills/paradigmnetworks-login/SKILL.md=17c8e4340a5aec877a27c4318385e7acf6ed0d3803a599497e8fea77d6b38639
    cursor/skills/paradigmnetworks-logout/SKILL.md=29e2f807d51e6a606ee8a62b1355e17ce3aad9e8a84da43e200519a2e0b00afe
    cursor/rules/pn-login-check.mdc=0f2fb6cbda068924fd9986fef5e362e0ccc8297304ed27a56efe5af46bf7c5a7
    claude/.claude-plugin/plugin.json=e3a2c5cea4724ba4832bc3c315171a0d1114c4ac1f8c523d05c1ee4ef4bd8c58
    cursor/.cursor-plugin/plugin.json=4ddc85cc1daf38d7d896d7e37c852dcd3cb95b0f56fc28734830ff19265bde7e
    .claude-plugin/marketplace.json=0e5d4e08513f1a25605f2afa1ca3fc3a86df9fc95756828000b0f5684eb978ea
    .cursor-plugin/marketplace.json=65fe416a87e6c4910dba1a8fd67e92f34cf04767c02c1eba58c30beca62979ea

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # On a pull request, the checks come from the branch it targets, not from
      # the pull request: the release App can't change workflows, but it could
      # change .github/scripts. A change to the checks takes effect once merged.
      - name: Trusted checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checks="$RUNNER_TEMP/checks"
          mkdir "$checks"
          for f in check-code.sh check-lists.sh check-signatures.sh; do
            if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:.github/scripts/$f" 2>/dev/null; then
              git show "$BASE_SHA:.github/scripts/$f" >"$checks/$f"
            else
              # A push, or the pull request that first brings the checks in.
              cp ".github/scripts/$f" "$checks/$f"
            fi
          done
          chmod +x "$checks"/*
          echo "CHECKS=$checks" >>"$GITHUB_ENV"
      # Each plugin's runtime/SHA256SUMS is the list the release key signs: the
      # six builds, which the launcher downloads and checks before every run,
      # and every other file the plugin ships (hooks, scripts, skills,
      # launchers, plugin.json). The builds themselves are on the GitHub
      # Release: stage 2 and stage 3 check them there (check-release.sh).
      - name: Each plugin's list names every file it ships, and all match
        run: |
          version="$(sed -n 's/^version: *//p' BUILD)"
          for plugin in claude cursor; do
            manifest="$plugin/.$plugin-plugin/plugin.json"
            plugin_version="$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' "$manifest" | head -1)"
            if [ "$plugin_version" != "$version" ]; then
              echo "::error::$manifest says $plugin_version, BUILD says $version."
              exit 1
            fi
          done
          "$CHECKS/check-lists.sh" . "$version"
      # Everything in the launchers, verify.ps1, run-hook.cmd, the hooks and
      # the login scripts but the keys and require-signature switch is the
      # pinned code (LAUNCHER_CODE).
      - name: The launchers are the pinned code
        run: '"$CHECKS/check-code.sh" .'
      # The launchers carry the release public key and require a signature.
      # They're run as users run them, downloading the builds, once the
      # release is published (the launchers job).
      - name: Releases are signed, and the launchers require it
        run: |
          "$CHECKS/check-signatures.sh" .
          for setting in "claude/runtime/pn-plugin:require_signature=1" "cursor/runtime/pn-plugin:require_signature=1" \
            'cursor/runtime/verify.ps1:$RequireSignature = $true' 'cursor/scripts/run-hook.cmd:set "PN_REQUIRE_SIGNATURE=1"'; do
            file="${setting%%:*}"
            if ! grep -qxF -- "${setting#*:}" "$file"; then
              echo "::error::$file doesn't require a signature (${setting#*:})."
              exit 1
            fi
          done
          echo "Both plugins' lists are signed with the release key, and every launcher requires it."

  launchers:
    # The published release, as users get it: on a push to develop after stage
    # 2 has published the pre-release, and on a push to main before stage 3
    # makes it the latest release. Nothing is installed or downloaded by hand:
    # the launchers download the build for this runner from github.com, check
    # the list's signature (openssl; Windows PowerShell 5.1 and the P1363 copy
    # for Cursor on Windows) and the build's hash, and run it. A fresh cache
    # each time, so every run downloads.
    needs: [verify, tag]
    if: always() && github.event_name == 'push' && needs.verify.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # macOS and Linux, and Claude Code on Windows (Git Bash).
      - name: The sh launchers download, check and run the build
        shell: bash
        run: |
          version="$(sed -n 's/^version: *//p' BUILD)"
          if [ "$RUNNER_OS" = Windows ]; then
            rm -rf "$LOCALAPPDATA/ParadigmNetworks"
          else
            rm -rf "$HOME/.paradigm-networks"
          fi
          for plugin in claude cursor; do
            got="$("$plugin/runtime/pn-plugin" version)" || got=
            if [ "$got" != "$version" ]; then
              echo "::error::$plugin/runtime/pn-plugin printed \"$got\", want $version: it didn't download, check or run the release's build (above)."
              exit 1
            fi
          done
          echo "Both sh launchers downloaded, checked and ran v$version."
      # Cursor on Windows: verify.ps1 under Windows PowerShell 5.1 downloads
      # and checks both Windows builds; run-hook.cmd and check-configured.ps1
      # run the one for this runner.
      - name: Cursor's Windows launchers download, check and run the build
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "%LOCALAPPDATA%\ParadigmNetworks" rd /s /q "%LOCALAPPDATA%\ParadigmNetworks"
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File cursor\runtime\verify.ps1 -Arch amd64 || exit /b 1
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File cursor\runtime\verify.ps1 -Arch arm64 || exit /b 1
          echo {} | cmd /c cursor\scripts\run-hook.cmd check-session-end > "%RUNNER_TEMP%\hook.out" || exit /b 1
          type "%RUNNER_TEMP%\hook.out"
          findstr /C:"couldn't check its program" "%RUNNER_TEMP%\hook.out" >nul && exit /b 1
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File cursor\scripts\check-configured.ps1 > "%RUNNER_TEMP%\configured.out"
          type "%RUNNER_TEMP%\configured.out"
          findstr /R /C:"CONFIGURED" "%RUNNER_TEMP%\configured.out" >nul || exit /b 1
          echo Cursor's Windows launchers downloaded, checked and ran the build.

  promotion:
    # A PR into staging or main must bring exactly the plugin files of the
    # release tagged on develop (v<version> from BUILD): what QA tested is what
    # users get. Needs the tag, so the release must have been tagged first.
    # It can't go back to an older version either: an older release may not
    # require signatures, or may have a bug a later one fixed.
    if: github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Same files as the tested release, and not older
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          version="$(sed -n 's/^version: *//p' BUILD)"
          base_version="$(git show "origin/$BASE_REF:BUILD" 2>/dev/null | sed -n 's/^version: *//p')"
          if [ -n "$base_version" ] && [ "$(printf '%s\n' "$base_version" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::This promotion would take $BASE_REF from v$base_version back to v$version."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version isn't tagged yet. Tag the release on develop before promoting it."
            exit 1
          fi
          paths=(.claude-plugin .cursor-plugin claude cursor BUILD SHA256SUMS)
          if ! git diff --quiet "v$version" HEAD -- "${paths[@]}"; then
            echo "::error::This promotion's plugin files differ from v$version, the release QA tested."
            git diff --stat "v$version" HEAD -- "${paths[@]}"
            exit 1
          fi
          echo "Plugin files match v$version."

  # Stages 2 and 3 of a release (release/README.md in the source repository).
  # Both run only on a push, after verify and windows pass on that commit.
  #
  # Immutable releases are on in this repository. Once published, a release's
  # files can't be added, replaced or deleted and its tag can't move, but its
  # title, notes and pre-release/latest status can still change
  # (https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
  # and https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/immutable-releases).
  # So stage 1 attaches every file to a draft, stage 2 checks the draft and
  # publishes it as a pre-release (immutable from then on), and stage 3 only
  # checks it again and flips it to the latest release.

  tag:
    # Stage 2: when a release PR is merged into develop, check the draft
    # GitHub Release v<version> that stage 1 made, tag the merge commit
    # v<version>, and publish the draft as a pre-release, which QA then
    # downloads and tests. The list must be signed with a pinned release key
    # (RELEASE_KEYS above) and the launchers must be the pinned code
    # (LAUNCHER_CODE), so neither a release PR nor a stray tag can bring in a
    # key or a check of its own. A push that isn't a new release (its version
    # is tagged on another commit) does nothing; a re-run on the tagged commit
    # finishes publishing a pre-release that's still a draft.
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the pn-plugins-release App's key; deployment branch develop only,
    # so pull requests and other branches can't reach it. Only the App and org
    # admins may create v* tags (ruleset plugins-release-tag-creation; GitHub
    # doesn't let a ruleset exempt GitHub Actions itself).
    environment: release-publish
    concurrency:
      group: release-tag-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # every tag, to find the last release
          persist-credentials: false
      - name: A new release, signed with a pinned key, with the pinned launchers
        id: check
        run: |
          version="$(sed -n 's/^version: *//p' BUILD)"
          tag="v$version"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::BUILD's version \"$version\" isn't a plain release version (X.Y.Z)."
            exit 1
          fi
          tagged=false
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at="$(git rev-parse "$tag^{commit}")"
            if [ "$at" != "$GITHUB_SHA" ]; then
              # Fine only for a later push to develop (a CI change, say): the
              # tag is on the earlier commit that brought this very BUILD, and
              # this push doesn't change it. A tag on a commit with another
              # BUILD, or this push being the release itself, means the tag
              # was made elsewhere, for example by publishing the draft by
              # hand, which tags the draft's target (an older develop).
              if ! git show "$at:BUILD" 2>/dev/null | cmp -s - BUILD; then
                echo "::error::$tag is on $at, whose BUILD isn't this release's ($version, this BUILD). The tag was made on the wrong commit, for example by publishing the draft release by hand (which tags the draft's target). Delete the tag (and turn a published release back into a draft), then re-run this job."
                exit 1
              fi
              if ! git diff --quiet HEAD^ HEAD -- BUILD SHA256SUMS; then
                echo "::error::This push is the release of $version (it changes BUILD or SHA256SUMS), but $tag is already on $at, not on this merge commit ($GITHUB_SHA). Delete the tag (and turn a published release back into a draft), then re-run this job."
                exit 1
              fi
              if ! git merge-base --is-ancestor "$at" HEAD; then
                echo "::error::$tag is on $at, which isn't in develop's history."
                exit 1
              fi
              echo "$tag is already released on $at (same BUILD), and this push doesn't change BUILD or SHA256SUMS: it isn't a release. Nothing to do."
              exit 0
            fi
            # An earlier run tagged this commit; finish its pre-release.
            echo "$tag is already this commit."
            tagged=true
          else
            if git diff --quiet HEAD^ HEAD -- BUILD SHA256SUMS; then
              echo "::error::$tag isn't tagged, but this commit doesn't change BUILD or SHA256SUMS: it isn't a release."
              exit 1
            fi
            last="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            if [ -n "$last" ] && [ "$(printf '%s\n' "$last" "$tag" | sort -V | tail -1)" != "$tag" ]; then
              echo "::error::$tag isn't higher than the last release, $last."
              exit 1
            fi
          fi
          .github/scripts/check-code.sh .
          .github/scripts/check-lists.sh . "$version"
          .github/scripts/check-signatures.sh .
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "tagged=$tagged"
          } >>"$GITHUB_OUTPUT"
      # The App's token covers this repository only, with contents write and
      # nothing else (drafts are visible only with write access), and is
      # minted only once the checks above have passed.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.check.outputs.tag != ''
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      # Before anything is tagged: the draft holds exactly the six builds, each
      # matching its line in both signed lists, and both lists with their
      # signatures, byte for byte this commit's.
      - name: The draft release has exactly the signed files
        if: steps.check.outputs.tag != ''
        id: release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: .github/scripts/check-release.sh . "$VERSION"
      - name: Tag the merge commit
        if: steps.check.outputs.tag != '' && steps.check.outputs.tagged != 'true' && steps.release.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          got="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          if [ "$got" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $got, not $GITHUB_SHA."
            exit 1
          fi
          echo "Tagged $GITHUB_SHA as $TAG."
      - name: Publish the pre-release for QA
        if: steps.check.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
          TAGGED: ${{ steps.check.outputs.tagged }}
          DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          if [ "$DRAFT" != true ]; then
            # Published already. Fine on a re-run for the commit an earlier
            # run tagged; with no tag, something other than stage 2 published
            # it (the step above tags only a draft), so stop here.
            if [ "$TAGGED" != true ]; then
              echo "::error::$TAG is already published, but isn't tagged: stage 2 didn't publish it. Check the release before going on."
              exit 1
            fi
            echo "$TAG is already published. Nothing to do."
            exit 0
          fi
          # Not the latest release: users get it only once stage 3 promotes it.
          # The title and notes stay stage 1's until then.
          gh release edit "$TAG" --draft=false --prerelease --latest=false --verify-tag
          # Published, so immutable from now on: check what got published (the
          # draft could have changed after the check above).
          GITHUB_OUTPUT="$RUNNER_TEMP/published" .github/scripts/check-release.sh . "$VERSION"
          for want in draft=false prerelease=true immutable=true; do
            if ! grep -qxF "$want" "$RUNNER_TEMP/published"; then
              echo "::error::$TAG was published but isn't $want. Check the release and the repository's immutable releases setting."
              exit 1
            fi
          done
          echo "Published $TAG as a pre-release. QA downloads and tests it; stage 3 makes it the latest release once it reaches main."

  publish:
    # Stage 3: when a release reaches main (what users install), check main
    # has exactly the tagged files, whose code, lists and signatures it checks
    # again, check the pre-release stage 2 published still holds exactly the
    # signed files (it can't change, being immutable), then make it a full
    # release, marked latest, with notes from CHANGELOG.md. It attaches
    # nothing: an immutable release can't take new files. A version already
    # promoted is left alone. Uses this job's own token: it creates no tag.
    needs: [verify, launchers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write # change the release's pre-release/latest status and notes
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Main has exactly the tagged files
        id: check
        run: |
          version="$(sed -n 's/^version: *//p' BUILD)"
          tag="v$version"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag isn't tagged. Stage 2 tags a release when it's merged into develop; promote only tagged releases."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" HEAD; then
            echo "::error::$tag isn't in main's history: main didn't get this release through the promotion PRs."
            exit 1
          fi
          previous="$(git show HEAD^1:BUILD 2>/dev/null | sed -n 's/^version: *//p')"
          if [ -n "$previous" ] && [ "$(printf '%s\n' "$previous" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "::error::main went from v$previous back to v$version. Promote a newer release instead."
            exit 1
          fi
          paths=(.claude-plugin .cursor-plugin claude cursor BUILD SHA256SUMS)
          if ! git diff --quiet "$tag" HEAD -- "${paths[@]}"; then
            echo "::error::main's plugin files differ from $tag, the release QA tested."
            git diff --stat "$tag" HEAD -- "${paths[@]}"
            exit 1
          fi
          # Again on the tagged files: the launchers are the pinned code, the
          # lists name every file and match, and are signed with a pinned key.
          # Stage 2 checks this before it tags, but the App could create a v*
          # tag without it.
          .github/scripts/check-code.sh .
          .github/scripts/check-lists.sh . "$version"
          .github/scripts/check-signatures.sh .
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: The release has exactly the signed files
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: .github/scripts/check-release.sh . "$VERSION"
      - name: Make it the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
          DRAFT: ${{ steps.release.outputs.draft }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          IMMUTABLE: ${{ steps.release.outputs.immutable }}
        run: |
          if [ "$DRAFT" != false ]; then
            echo "::error::$TAG is still a draft. Stage 2 (the tag job on develop) publishes it as a pre-release for QA; re-run it for the release commit, and promote only after QA."
            exit 1
          fi
          if [ "$IMMUTABLE" != true ]; then
            echo "::error::$TAG isn't immutable. Turn immutable releases on for this repository; a release that can change can't be promoted."
            exit 1
          fi
          if [ "$PRERELEASE" = false ]; then
            echo "$TAG is already a full release. Nothing to do."
            exit 0
          fi
          .github/scripts/release-notes.sh . "$VERSION" >"$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --prerelease=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$TAG" ]; then
            echo "::error::$TAG was promoted, but the latest release is $latest."
            exit 1
          fi
          echo "$TAG is the latest release."
